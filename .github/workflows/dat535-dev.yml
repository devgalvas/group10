name: DAT535 — Dev Pipeline

# Every push to dev runs the pipeline end to end on the one-day sample, in the isolated dev
# data root (/data/ais/dev). Pull requests are covered by ci.yml on GitHub-hosted runners.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: vm-pipeline
  cancel-in-progress: false

jobs:
  run-dev:
    name: Run Dev Pipeline
    runs-on: self-hosted
    environment: dev
    timeout-minutes: 60
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SAMPLE_DATE: "2026-09-01"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install the package into the dev venv
        run: ~/ais-env-dev/bin/pip install --quiet .

      - name: Run bronze, silver and gold on the sample
        run: |
          unset SPARK_HOME
          ~/ais-env-dev/bin/ais-pipeline --env dev run \
            --start "$SAMPLE_DATE" --end "$SAMPLE_DATE" --stages bronze,silver,gold

      - name: Data quality report
        if: always()
        run: |
          unset SPARK_HOME
          # grep drops Spark's ":: loading settings ::" line, which Actions would parse as a command.
          ~/ais-env-dev/bin/ais-pipeline --env dev dq-report --date "$SAMPLE_DATE" \
            | grep -v '^::' | tee dq-report.md
          cat dq-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dq-report-dev
          path: dq-report.md
