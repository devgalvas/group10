env: ci
data_root: .ais-ci                # overridden by $AIS_DATA_ROOT (pytest tmp_path)
landing_dir: ${data_root}/landing
lake_dir: ${data_root}/lake
source:
  base_url: "http://aisdata.ais.dk/"      # confirm exact URL/pattern in AIS-11
  file_pattern: "aisdk-{date}.zip"         # {date} = YYYY-MM-DD
  sample_file: null
window: {start: "2026-09-01", end: "2026-09-01"}
spark:
  master: "local[2]"
  app_name: "ais-pipeline-ci"
  driver_memory: "1g"
  shuffle_partitions: 2
  event_log_dir: null
quality:
  max_reject_rate: 0.05          # rejects excl. OUT_OF_SCOPE_MOBILE / rows in scope; set from AIS-16
  min_rows_vs_median: 0.5        # day row count vs median of processed days
  min_hours_present: 24
features:
  jump_speed_kn: 50
  port_call_gap_h: 2
  min_port_call_min: 30
  anchor_max_sog_kn: 1.0
refs: {ports: "ref/ports.csv", ship_types: "ref/ship_type_groups.csv"}
